<!--nav:people-->
  <main>
    <h1>Анна Ким</h1>
    <p class="sub">
      <a href="#">К карточке</a>
      · встреч: 5
      · первая 12 мая 2026
    </p>
    <form class="card">
      <div class="field">
        <label for="full_name2">Имя</label>
        <input type="text" id="full_name2" value="Анна Ким" />
      </div>
      <div class="grid2">
        <div class="field">
          <label for="role_title2">Роль</label>
          <input type="text" id="role_title2" value="Senior engineer" />
        </div>
        <div class="field">
          <label for="email2">Email</label>
          <input type="email" id="email2" value="anna@example.com" />
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="cadence_days2">
            Каденс, дней
            <span class="hint">Как часто хотите встречаться. Пусто — без напоминаний.</span>
          </label>
          <input type="number" id="cadence_days2" value="14" />
        </div>
        <div class="field">
          <label for="anchor2">
            Отсчёт каденса с
            <span class="hint">Встречи уже есть — каденс считается от последней.</span>
          </label>
          <input type="date" id="anchor2" value="" />
        </div>
      </div>
      <div class="field">
        <label for="meeting_url2">
          Ссылка на встречу
          <span class="hint">Постоянная комната для ваших 1:1: Meet, Zoom, что угодно.</span>
        </label>
        <input type="text" id="meeting_url2" value="meet.example.com/abc-defg-hij" />
      </div>
      <div class="field">
        <label for="tpl2">Шаблон по умолчанию</label>
        <select id="tpl2">
          <option>Регулярный 1:1</option>
          <option>Квартальный обзор</option>
        </select>
      </div>
      <div class="field">
        <label for="notes2">
          Мои заметки о человеке
          <span class="hint">Приватно. Не попадает в саммари никогда.</span>
        </label>
        <textarea id="notes2">Хочет вести проект целиком. Готова, но нужен второй инженер на подхвате.</textarea>
      </div>
      <div class="actions-bar">
        <button class="primary" type="button">Сохранить</button>
        <a class="btn" href="#">Отмена</a>
      </div>
    </form>

    <h2>Архив</h2>
    <div class="card">
      <p class="small muted" style="margin: 0 0 12px">
        Человек убирается в архив, а не удаляется: встречи, ответы и графики остаются на месте.
      </p>
      <button class="danger" type="button">Убрать в архив</button>
    </div>
  </main>
